
<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON SURVIVOR 4.2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050510;color:white;font-family:Arial;overflow:hidden}
#game{height:100dvh;display:flex;align-items:center;justify-content:center}
canvas#canvas{width:min(100vw,960px);height:auto;max-height:100dvh;background:#09091c;border:2px solid #00eaff}
#hud{position:absolute;top:10px;left:12px;z-index:2;line-height:1.8;text-shadow:0 0 8px #00eaff;pointer-events:none}
#minimap{position:absolute;right:12px;bottom:12px;width:130px;height:82px;background:#10102b;border:1px solid #00eaff}
#bossBar{display:none;position:absolute;top:12px;left:50%;transform:translateX(-50%);width:min(350px,60vw);height:16px;border:2px solid red;background:#300}
#bossHealth{height:100%;width:100%;background:#f14}
#overlay{position:absolute;inset:0;z-index:5;background:#050510ee;display:flex;align-items:center;justify-content:center;overflow:auto}
.panel{width:min(420px,92vw);max-height:90dvh;overflow:auto;background:#10102b;border:2px solid #00eaff;border-radius:15px;padding:22px;text-align:center;box-shadow:0 0 25px #00eaff55}
h1{color:#00eaff;text-shadow:0 0 12px #00eaff}
input,select,button{width:100%;padding:12px;margin-top:10px;border-radius:7px;font-size:16px}
input,select{background:#080818;color:white;border:1px solid #00eaff}
button{background:#00dfff;color:#050510;border:0;font-weight:bold;cursor:pointer}
button:hover{background:white}
#message{color:#ff6688;margin-top:10px}
#mobileControls{display:none;position:absolute;inset:0;z-index:3;pointer-events:none}
#joystick{position:absolute;left:22px;bottom:28px;width:125px;height:125px;border:3px solid #00eaff;border-radius:50%;background:#00eaff22;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:35px;top:35px;width:48px;height:48px;border-radius:50%;background:#00eaff;box-shadow:0 0 15px #00eaff}
#dashButton{position:absolute;right:25px;bottom:45px;width:85px;height:85px;border-radius:50%;background:#ff1744;color:white;border:3px solid white;pointer-events:auto;touch-action:none}
#leaderboard{max-height:45vh;overflow:auto;text-align:left}
#leaderboard p{padding:7px;border-bottom:1px solid #333}
@media(pointer:coarse){#mobileControls{display:block}#minimap{width:95px;height:60px}}
</style>
</head>
<body>
<div id="game">
<canvas id="canvas" width="960" height="540"></canvas>
<div id="hud">
<div>❤️ Život: <span id="health">1</span></div>
<div>🪙 Novčići: <span id="coins">0</span></div>
<div>⭐ Rezultat: <span id="score">0</span></div>
<div>⏱ Vrijeme: <span id="time">0</span>s</div>
</div>
<div id="bossBar"><div id="bossHealth"></div></div>
<canvas id="minimap" width="260" height="160"></canvas>
<div id="mobileControls">
<div id="joystick"><div id="stick"></div></div>
<button id="dashButton">DASH</button>
</div>
<div id="overlay">
<div class="panel" id="panel">
<h1>NEON SURVIVOR</h1>
<p>4.2 – GLOBAL UPDATE</p>
<p id="message">Poveži Supabase da uključiš online račune.</p>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Lozinka">
<input id="username" maxlength="16" placeholder="Ime igrača">
<select id="country">
<option value="Croatia">🇭🇷 Hrvatska</option>
<option value="Serbia">🇷🇸 Srbija</option>
<option value="Bosnia and Herzegovina">🇧🇦 BiH</option>
<option value="Germany">🇩🇪 Njemačka</option>
<option value="Austria">🇦🇹 Austrija</option>
<option value="United States">🇺🇸 SAD</option>
<option value="United Kingdom">🇬🇧 UK</option>
<option value="Other">🌍 Ostalo</option>
</select>
<button id="register">REGISTRACIJA</button>
<button id="login">PRIJAVA</button>
<button id="showBoard">GLOBALNI LEADERBOARD</button>
</div>
</div>
</div>

<script>
// 1. OVDJE ĆEŠ UPISATI SUPABASE PODATKE
const SUPABASE_URL = "OVDJE_STAVI_PROJECT_URL";
const SUPABASE_KEY = "OVDJE_STAVI_ANON_PUBLIC_KEY";

let db = null;
let onlineReady = false;

if (SUPABASE_URL.startsWith("https://") &&
    SUPABASE_KEY !== "OVDJE_STAVI_ANON_PUBLIC_KEY") {
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  onlineReady = true;
}

const $ = id => document.getElementById(id);
const canvas = $("canvas");
const ctx = canvas.getContext("2d");
const mini = $("minimap");
const mctx = mini.getContext("2d");

const WORLD_W = 2400, WORLD_H = 1500;
let player, enemies=[], bullets=[], particles=[], drops=[];
let boss=null, keys={}, camera={x:0,y:0};
let score=0, money=0, elapsed=0, lastSpawn=0, lastShot=0;
let running=false, lastFrame=0, currentUser=null;
let mobileX=0,mobileY=0,dashCooldown=0;

function message(t){$("message").textContent=t;}

function showPanel(html){
  $("overlay").style.display="flex";
  $("panel").innerHTML=html;
}

async function register(){
  if(!onlineReady){message("Prvo treba povezati Supabase.");return;}
  const email=$("email").value.trim();
  const password=$("password").value;
  const username=$("username").value.trim();
  const country=$("country").value;

  if(!email || password.length<6 || username.length<3){
    message("Unesi email, lozinku od barem 6 znakova i ime od barem 3 znaka.");
    return;
  }

  const {data,error}=await db.auth.signUp({
    email,password,
    options:{data:{username,country}}
  });

  if(error){message(error.message);return;}
  if(data.session){
    currentUser=data.user;
    startGame();
  }else{
    message("Provjeri email i potvrdi registraciju, pa se prijavi.");
  }
}

async function login(){
  if(!onlineReady){message("Prvo treba povezati Supabase.");return;}
  const {data,error}=await db.auth.signInWithPassword({
    email:$("email").value.trim(),
    password:$("password").value
  });
  if(error){message(error.message);return;}
  currentUser=data.user;
  startGame();
}

$("register").onclick=register;
$("login").onclick=login;
$("showBoard").onclick=showLeaderboard;

async function showLeaderboard(){
  if(!onlineReady){
    message("Globalni leaderboard još nije povezan.");
    return;
  }
  const {data,error}=await db.from("scores")
    .select("username,country,score")
    .order("score",{ascending:false})
    .limit(100);

  if(error){message(error.message);return;}

  let rows="";
  (data||[]).forEach((p,i)=>{
    rows+=`<p>${i+1}. <b>${escapeText(p.username)}</b> — ${countryFlag(p.country)} ${escapeText(p.country)} — ${p.score}</p>`;
  });

  showPanel(`<h1>GLOBAL TOP 100</h1><div id="leaderboard">${rows||"Još nema rezultata."}</div><button onclick="backToMenu()">POVRATAK</button>`);
}

function escapeText(s){
  return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function countryFlag(c){
  const flags={"Croatia":"🇭🇷","Serbia":"🇷🇸","Bosnia and Herzegovina":"🇧🇦","Germany":"🇩🇪","Austria":"🇦🇹","United States":"🇺🇸","United Kingdom":"🇬🇧","Other":"🌍"};
  return flags[c]||"🌍";
}
function backToMenu(){location.reload();}

async function saveScore(){
  if(!db||!currentUser)return;
  const meta=currentUser.user_metadata||{};
  const username=meta.username||currentUser.email.split("@")[0];
  const country=meta.country||"Other";

  const {error}=await db.from("scores").upsert({
    user_id:currentUser.id,
    username,country,score,coins:money
  },{onConflict:"user_id"});

  if(error)console.error("Greška spremanja rezultata:",error.message);
}

function startGame(){
  player={x:WORLD_W/2,y:WORLD_H/2,speed:230,radius:14,hp:1,dash:0};
  enemies=[];bullets=[];particles=[];drops=[];boss=null;
  score=0;money=0;elapsed=0;lastSpawn=0;lastShot=0;
  dashCooldown=0;
  $("overlay").style.display="none";
  $("bossBar").style.display="none";
  running=true;
  lastFrame=performance.now();
  requestAnimationFrame(gameLoop);
}

window.addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.code==="Space"){
    e.preventDefault();
    dash();
  }
});
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function dash(){
  if(running&&dashCooldown<=0){
    player.dash=.2;
    dashCooldown=1.5;
  }
}

$("dashButton").addEventListener("pointerdown",e=>{
  e.preventDefault();dash();
});

const joystick=$("joystick"),stick=$("stick");
let joyActive=false;
joystick.addEventListener("pointerdown",e=>{
  joyActive=true;joystick.setPointerCapture(e.pointerId);moveJoy(e);
});
joystick.addEventListener("pointermove",e=>{if(joyActive)moveJoy(e);});
joystick.addEventListener("pointerup",resetJoy);
joystick.addEventListener("pointercancel",resetJoy);

function moveJoy(e){
  const r=joystick.getBoundingClientRect();
  let x=e.clientX-(r.left+r.width/2);
  let y=e.clientY-(r.top+r.height/2);
  const len=Math.hypot(x,y),max=38;
  if(len>max){x=x/len*max;y=y/len*max;}
  mobileX=x/max;mobileY=y/max;
  stick.style.left=(38+x)+"px";
  stick.style.top=(38+y)+"px";
}
function resetJoy(){
  joyActive=false;mobileX=0;mobileY=0;
  stick.style.left="35px";stick.style.top="35px";
}

function spawnEnemy(){
  const a=Math.random()*Math.PI*2;
  const roll=Math.random();
  let type="normal",hp=5,speed=75,radius=13;
  if(roll<.2){type="fast";hp=3;speed=145;}
  else if(roll<.4){type="tank";hp=8;speed=48;radius=19;}
  enemies.push({
    x:player.x+Math.cos(a)*520,
    y:player.y+Math.sin(a)*520,
    hp,speed,type,radius,flash:0
  });
}

function spawnBoss(){
  const a=Math.random()*Math.PI*2;
  boss={x:player.x+Math.cos(a)*550,y:player.y+Math.sin(a)*550,
    hp:240,maxHp:240,speed:65,radius:35,flash:0};
  $("bossBar").style.display="block";
}

function shoot(){
  let target=boss;
  let nearest=boss?Math.hypot(boss.x-player.x,boss.y-player.y):Infinity;
  for(const e of enemies){
    const d=Math.hypot(e.x-player.x,e.y-player.y);
    if(d<nearest){nearest=d;target=e;}
  }
  if(!target)return;
  const a=Math.atan2(target.y-player.y,target.x-player.x);
  bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*430,vy:Math.sin(a)*430,life:2});
}

function burst(x,y,n=8){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=40+Math.random()*150;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.7});
  }
}

function update(dt){
  elapsed+=dt;
  dashCooldown=Math.max(0,dashCooldown-dt);

  let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+mobileX;
  let dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+mobileY;
  const len=Math.hypot(dx,dy)||1;
  const mult=player.dash>0?3:1;
  player.x+=dx/len*player.speed*mult*dt;
  player.y+=dy/len*player.speed*mult*dt;
  player.x=Math.max(14,Math.min(WORLD_W-14,player.x));
  player.y=Math.max(14,Math.min(WORLD_H-14,player.y));
  player.dash=Math.max(0,player.dash-dt);

  if(elapsed-lastSpawn>1.1){spawnEnemy();lastSpawn=elapsed;}
  if(elapsed>=30&&Math.floor(elapsed/30)>Math.floor((elapsed-dt)/30)&&!boss)spawnBoss();
  if(elapsed-lastShot>.48){shoot();lastShot=elapsed;}

  for(const e of enemies){
    const a=Math.atan2(player.y-e.y,player.x-e.x);
    e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;
    e.flash=Math.max(0,e.flash-dt);
    if(Math.hypot(e.x-player.x,e.y-player.y)<e.radius+player.radius){gameOver();return;}
  }

  if(boss){
    const a=Math.atan2(player.y-boss.y,player.x-boss.x);
    boss.x+=Math.cos(a)*boss.speed*dt;boss.y+=Math.sin(a)*boss.speed*dt;
    if(Math.hypot(boss.x-player.x,boss.y-player.y)<boss.radius+player.radius){gameOver();return;}
  }

  for(const b of bullets){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    for(const e of enemies){
      if(e.hp>0&&Math.hypot(b.x-e.x,b.y-e.y)<e.radius+5){
        e.hp--;e.flash=.12;b.life=0;burst(b.x,b.y,3);
        if(e.hp<=0){
          score+=e.type==="tank"?30:e.type==="fast"?20:10;
          drops.push({x:e.x,y:e.y,life:12});
          burst(e.x,e.y,12);
        }
        break;
      }
    }
    if(boss&&b.life>0&&Math.hypot(b.x-boss.x,b.y-boss.y)<boss.radius+5){
      boss.hp-=2;b.life=0;boss.flash=.12;burst(b.x,b.y,4);
      if(boss.hp<=0){
        score+=500;money+=50;burst(boss.x,boss.y,35);
        boss=null;$("bossBar").style.display="none";
      }
    }
  }
  bullets=bullets.filter(b=>b.life>0);
  enemies=enemies.filter(e=>e.hp>0);

  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}
  particles=particles.filter(p=>p.life>0);

  for(const d of drops){
    d.life-=dt;
    if(Math.hypot(d.x-player.x,d.y-player.y)<28){money++;d.life=0;}
  }
  drops=drops.filter(d=>d.life>0);

  camera.x=Math.max(0,Math.min(WORLD_W-canvas.width,player.x-canvas.width/2));
  camera.y=Math.max(0,Math.min(WORLD_H-canvas.height,player.y-canvas.height/2));

  $("health").textContent=player.hp;
  $("coins").textContent=money;
  $("score").textContent=score;
  $("time").textContent=Math.floor(elapsed);
  if(boss)$("bossHealth").style.width=(boss.hp/boss.maxHp*100)+"%";
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();ctx.translate(-camera.x,-camera.y);
  ctx.fillStyle="#09091c";ctx.fillRect(camera.x,camera.y,canvas.width,canvas.height);
  ctx.strokeStyle="#171738";
  for(let x=Math.floor(camera.x/60)*60;x<camera.x+canvas.width;x+=60){
    ctx.beginPath();ctx.moveTo(x,camera.y);ctx.lineTo(x,camera.y+canvas.height);ctx.stroke();
  }
  for(let y=Math.floor(camera.y/60)*60;y<camera.y+canvas.height;y+=60){
    ctx.beginPath();ctx.moveTo(camera.x,y);ctx.lineTo(camera.x+canvas.width,y);ctx.stroke();
  }
  for(const d of drops){
    ctx.fillStyle="#ffd700";ctx.shadowColor="#ffd700";ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(d.x,d.y,7,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  }
  for(const b of bullets){
    ctx.fillStyle="#00eaff";ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fill();
  }
  for(const e of enemies){
    ctx.fillStyle=e.flash>0?"white":e.type==="fast"?"#ffea00":e.type==="tank"?"#a000ff":"#ff3155";
    ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=14;
    ctx.beginPath();ctx.arc(e.x,e.y,e.radius,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle="white";ctx.font="12px Arial";ctx.textAlign="center";
    ctx.fillText(e.hp,e.x,e.y-e.radius-6);
  }
  if(boss){
    ctx.fillStyle="#ff1744";ctx.shadowColor="#ff1744";ctx.shadowBlur=25;
    ctx.beginPath();ctx.arc(boss.x,boss.y,boss.radius,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle="white";ctx.font="bold 16px Arial";ctx.textAlign="center";
    ctx.fillText("BOSS",boss.x,boss.y-45);
  }
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life/.7);ctx.fillStyle="#00eaff";
    ctx.fillRect(p.x,p.y,4,4);
  }
  ctx.globalAlpha=1;
  ctx.fillStyle="#00eaff";ctx.shadowColor="#00eaff";ctx.shadowBlur=18;
  ctx.beginPath();ctx.arc(player.x,player.y,player.radius,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.restore();
  drawMini();
}

function drawMini(){
  mctx.clearRect(0,0,mini.width,mini.height);
  mctx.fillStyle="#080818";mctx.fillRect(0,0,mini.width,mini.height);
  const sx=mini.width/WORLD_W,sy=mini.height/WORLD_H;
  mctx.fillStyle="#ff3155";
  for(const e of enemies)mctx.fillRect(e.x*sx-2,e.y*sy-2,4,4);
  if(boss){mctx.fillStyle="#ff1744";mctx.fillRect(boss.x*sx-4,boss.y*sy-4,8,8);}
  mctx.fillStyle="#00eaff";mctx.beginPath();
  mctx.arc(player.x*sx,player.y*sy,4,0,Math.PI*2);mctx.fill();
}

function gameLoop(t){
  if(!running)return;
  const dt=Math.min((t-lastFrame)/1000,.04);lastFrame=t;
  update(dt);if(!running)return;
  draw();requestAnimationFrame(gameLoop);
}

async function gameOver(){
  if(!running)return;
  running=false;
  await saveScore();
  showPanel(`<h1 style="color:#ff3155">GAME OVER</h1>
    <p>Rezultat: ${score}</p><p>Novčići: ${money}</p>
    <p>Vrijeme: ${Math.floor(elapsed)} sekundi</p>
    <button onclick="startGame()">IGRAJ PONOVNO</button>
    <button onclick="showLeaderboard()">GLOBALNI LEADERBOARD</button>
    <button onclick="backToMenu()">IZLAZ</button>`);
}
</script>
</body>
</html>
